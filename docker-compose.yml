services:
  postgres:
    image: postgres:17-alpine
    container_name: neural-bank-postgres
    environment:
      POSTGRES_DB: neural_bank
      POSTGRES_USER: neural_bank
      POSTGRES_PASSWORD: neural_bank
    ports:
      - "5432:5432"
    volumes:
      - neural_bank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural_bank -d neural_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neural_bank_postgres_data:
